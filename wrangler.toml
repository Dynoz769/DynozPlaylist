# Tetapan Cloudflare Workers untuk versi online DYNOZ PLAYLIST.
# Deploy: npm run deploy   (lihat README.md bahagian "Online")

name = "dynoz-playlist"
main = "worker.js"
compatibility_date = "2026-09-01"

# Fail webapp dihidang terus dari folder public/
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
DYNOZ_REGION = "MY"

# Pangkalan data playlist (dibuat dengan "npx wrangler d1 create dynoz-playlist").
[[d1_databases]]
binding = "DB"
database_name = "dynoz-playlist"
database_id = "45c9ee42-09e9-48c8-8e37-5dcc354f01de"
